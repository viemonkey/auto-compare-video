    <style>
      :root {
        --bg-fallback: #0c1524; /* sampled from assets/backgrounds/marble-jewelry-stand.png's top corner — edge/load fallback only, the image covers the frame */
        --accent-yellow: #ffe600;
        --dark-stroke: #000000;
        --cap-idle: #ffffff;   /* running-caption word, not yet spoken / already spoken */
        --cap-active: #ffe600;  /* running-caption word being spoken right now */
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        font-family: "Be Vietnam Pro", sans-serif;
      }

      /* Marble jewelry-stand backdrop (2026-08-31, replaces the paper-notebook
         theme). assets/backgrounds/marble-jewelry-stand.png is 360x640 — an
         exact 1:3 scale of this 1080x1920 canvas, so `cover` renders it
         pixel-aligned with no crop/letterbox. Painted directly on #root: this
         composition is standalone (not assembled from multiple frame.md
         scenes) and uses no shader transitions/HDR, so a root-level fill is
         safe here (see hyperframes-core § determinism-rules). Card/label/host
         positions below are unchanged from the paper version. */
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background-color: var(--bg-fallback);
        background-image: url("assets/backgrounds/marble-jewelry-stand.png");
        background-size: cover;
        background-position: center top;
        background-repeat: no-repeat;
      }

      .clip {
        position: absolute;
        inset: 0;
      }

      /* ---------- top comparison zone ----------
         Two parallel panels, 48px paper seam, ~96px paper margin each outer
         edge. No VS badge, no card chrome — the photos are the graphic.
         (2026-08-31 v3: shrunk to 420x456 and pushed down to top:165 so the
         platform UI — follow button / channel name in the top ~150-200px —
         and the phone's rounded corners don't clip the panels on social feeds.) */
      .card {
        position: absolute;
        top: 360px; /* 2026-09-02 v3: pushed down so the comparison labels sit
                       ABOVE the photos (Mousse/Panna-Cotta style) and still
                       clear the TikTok top-UI / safe-area crop (~y0-230). */
        width: 420px;
        height: 372px;
        overflow: hidden;
        background: #000;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      }
      #card-left {
        left: 96px;
      }
      #card-right {
        left: 564px;
      }
      .card-image {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      /* darkens the off-topic panel — fading .card itself would blend it into
         the backdrop and wash it out instead */
      .card-veil {
        position: absolute;
        inset: 0;
        background: #0a0a12;
        opacity: 0;
        will-change: opacity;
      }

      /* ---------- beat labels (under each panel, on the backdrop) ----------
         The reference clip carries NO sentence subtitles — the voiceover says
         the sentence, the screen shows a short tag per side.
         (2026-08-31 v3: columns pulled inside a 72px left/right safe margin and
         the font stepped down so long Vietnamese tags wrap instead of bleeding
         off the 1080px frame / being clipped by the social-feed crop.) */
      #label-zone {
        position: absolute;
        top: 244px; /* 2026-09-02 v3: side tags now sit ABOVE the photos. Below
                       the TikTok top-crop line (~y230), above .card (y360). */
        left: 0;
        width: 1080px;
        height: 106px;
      }
      .beat-labels {
        position: absolute;
        inset: 0;
        opacity: 0;
      }
      .lb-col {
        position: absolute;
        top: 0;
        width: 444px;
        text-align: center;
      }
      .lb-left {
        left: 72px;
      }
      .lb-right {
        left: 564px;
      }
      .lb-wide {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        /* 2026-09-02 v3: the wide title (hook / question / CTA on beats 3,4,11,12)
           is too tall for the 106px side-tag band above the photos — drop it into
           the gap BELOW the photos (y ~742), where those beats show no running
           caption anyway. inset:auto cancels .beat-labels' inset:0. */
        inset: auto;
        top: 498px;
        left: 72px;
        right: 72px;
      }
      .lb-wide .lb-col {
        position: static;
        width: 936px;
      }
      .lb-1,
      .lb-2 {
        font-family: "Be Vietnam Pro", sans-serif;
        font-weight: 900;
        font-style: italic;
        text-transform: uppercase;
        line-height: 1.08;
        overflow-wrap: break-word;
        -webkit-text-stroke: 4px var(--dark-stroke);
        paint-order: stroke fill;
        text-shadow:
          3px 3px 0 #000,
          -3px -3px 0 #000,
          3px -3px 0 #000,
          -3px 3px 0 #000;
      }
      .lb-1 {
        font-size: 46px;
        letter-spacing: -0.01em;
        color: var(--accent-yellow);
      }
      .lb-wide .lb-1 {
        font-size: 60px;
      }
      /* The wide block carries the Gemini title, which the schema only caps at
         120 chars — without these tiers a long one wraps past the label zone
         and lands on the host's head. Applied by scaffold-compare-video.mjs. */
      .lb-wide.lb-tight .lb-1 {

      /* channel tag — kept for scripts/sync-channel.mjs, parked in the corner

      /* ---------- bottom host zone (Host HuyK) ----------
         The 2026-08 pose set is a 1:1 (square) 300x300 SVG canvas, each a
         waist-up photo cropped so the body reaches the frame bottom. All poses
         render at ONE shared size/position (see HOST_BASE in the script) so the
         body doesn't pulse between beats in motion — full rationale there. */
      #avatar-host {
        position: absolute;
        top: 866px;
        left: 0;
        width: 1080px;
        height: 1054px;
        opacity: 0;
        overflow: hidden;
        transform-origin: 50% 100%;
      }
      #host-fx {
        position: absolute;
        inset: 0;
        transform-origin: 50% 12%;
        /* 2026-09-01: was `will-change: transform, opacity`. The composited
           layer that promoted was getting dropped + re-rasterised by the
           headless compositor during long static pose holds, popping one
           frame of the host at a slightly-wrong raster (~18.70s / ~28.07s in
           the 2026-08-31 render, both "point" poses — widest silhouettes so
           the blip cleared the frame-diff threshold). Keep only opacity
           promoted; nothing animates this element's transform any more. */
        will-change: opacity;
      }
      .host-avatar-img {
        position: absolute;
        top: 8px;
        left: 50%;
        width: 910px;        /* 2026-08-30 v2: shrunk ~17% from 1100 — host was near-filling the lower frame */
        height: 910px;       /* MUST stay square — the pose assets are 1:1 (1400x1400 PNG) */
        margin-left: -455px; /* centre; GSAP drives x/y/scale on top for POSE_ADJUST */
        transform-origin: 50% 0;
      }

      /* ---------- running captions (TikTok/CapCut style) ----------
         2026-09-02 v3: side tags moved ABOVE the photos, so the gap BELOW the
         photos (photos end ~y732, host head ~y880) is now free for the caption.
         Single-line phrases (<=4 words). The word being spoken turns
         --cap-active and scales up. Per-word timing = assets/vo/words.json
         (Edge TTS boundaries). Plain GSAP-driven divs like #lb-*, no
         class="clip". Shares the y-band with .lb-wide, but those beats (3/4/11/12)
         show no running caption. */
      #caption-zone {
        position: absolute;
        top: 744px;
        left: 40px;
        width: 1000px;
        height: 96px;
        z-index: 8;
      }
      .cap-line {
        position: absolute;
        inset: 0;
        opacity: 0; /* plain opacity (not autoAlpha) — parent opacity:0 hides the
                       whole subtree regardless of a child phrase's visibility */
      }
      .cap-phrase {
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        text-align: center;
        white-space: nowrap; /* phrases are chunked <=4 words so they always fit one line */
        opacity: 0;
        visibility: hidden;
      }
      .cap-wd {
        display: inline-block;
        font-family: "Be Vietnam Pro", sans-serif;
        font-weight: 900;
        font-size: 44px;
        line-height: 1.1;
        color: var(--cap-idle);
        -webkit-text-stroke: 5px var(--dark-stroke);
        paint-order: stroke fill;
        text-shadow:
          3px 3px 0 #000,
          -2px -2px 0 #000,
          2px -2px 0 #000,
          -2px 2px 0 #000;
        transform-origin: 50% 65%;
        margin: 0 6px; /* breathing room so the scaled-up active word doesn't crowd its neighbours */
      }
    </style>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ---------- entrance ----------
      tl.fromTo("#card-left", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 0.0);
      tl.fromTo("#card-right", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 0.15);
      tl.fromTo("#avatar-host", { scale: 0.94, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.1);
      tl.fromTo("#eyebrow", { y: 8, opacity: 0 }, { y: 0, opacity: 0.55, duration: 0.4, ease: "power3.out" }, 0.15);

      // Fixed comparison titles above the photos — fade in once with the cards,
      // hold for the whole video (they never change; per-beat detail is the caption).
      tl.fromTo("#lb-fixed", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.28);

      // ---------- running captions (word-by-word karaoke) ----------
      // [word, start-sec] per line, from assets/vo/words.json (Edge TTS word
      // boundaries), starts relative to each clip's trimmed audio.
      const CAPTIONS = {
        1: [['Đây',0.08],['là',0.39],['Vàng',0.55],['vàng.',0.79]],
        2: [['Đây',0.08],['là',0.39],['Vàng',0.57],['trắng.',0.81]],
        3: [['Chọn',0.08],['nhẫn',0.42],['cưới:',0.61],['Vàng',1.12],['vàng',1.39],['truyền',1.59],['thống',1.81],['hay',2.04],['vàng',2.21],['trắng',2.43],['hiện',2.65],['đại?',2.83]],
        4: [['Bạn',0.08],['đang',0.38],['phân',0.55],['vân',0.74],['chọn',0.91],['nhẫn',1.15],['cưới',1.35],['vàng',1.57],['vàng',1.78],['hay',2.01],['vàng',2.17],['trắng',2.36],['cho',2.61],['ngày',2.72],['trọng',2.89],['đại?',3.11]],
        5: [['Vàng',0.08],['vàng',0.36],['còn',0.58],['có',0.75],['một',0.83],['ưu',1.03],['điểm',1.14],['đặc',1.34],['biệt:',1.48],['rất',1.92],['hợp',2.08],['làm',2.33],['nhẫn',2.55],['cưới',2.76],['truyền',2.94],['đời,',3.15],['gắn',3.58],['kết',3.82],['gia',4.01],['đình',4.18],['qua',4.40],['nhiều',4.58],['thế',4.79],['hệ.',4.92]],
        6: [['Còn',0.08],['vàng',0.35],['trắng',0.55],['có',0.77],['một',0.85],['điểm',1.00],['cộng',1.21],['lớn:',1.42],['giúp',1.90],['tôn',2.10],['sáng',2.32],['viên',2.58],['đá',2.75],['chính,',2.89],['khiến',3.36],['kim',3.62],['cương',3.81],['lấp',4.06],['lánh',4.22],['và',4.46],['nổi',4.59],['bật',4.80],['hơn',4.97],['hẳn.',5.18]],
        7: [['Vàng',0.08],['vàng',0.39],['mang',0.58],['sắc',0.74],['ấm',0.98],['cổ',1.14],['điển,',1.32],['tượng',1.83],['trưng',2.06],['cho',2.29],['sự',2.40],['thịnh',2.56],['vượng',2.77],['và',3.04],['bền',3.14],['vững.',3.34]],
        8: [['Vàng',0.08],['trắng',0.39],['mang',0.64],['vẻ',0.81],['đẹp',0.93],['hiện',1.10],['đại,',1.32],['thanh',1.81],['lịch',1.99],['và',2.18],['cực',2.31],['kỳ',2.51],['dễ',2.68],['phối',2.89],['đồ',3.09],['hàng',3.25],['ngày.',3.42]],
        9: [['Nhẫn',0.08],['vàng',0.38],['vàng',0.57],['rất',0.79],['bền',0.93],['màu,',1.09],['hầu',1.53],['như',1.76],['không',1.93],['bị',2.12],['phai',2.23],['hay',2.46],['đổi',2.58],['màu',2.74],['theo',2.98],['thời',3.14],['gian.',3.29]],
        10: [['Vàng',0.08],['trắng',0.38],['cần',0.59],['xi',0.77],['mạ',0.97],['lại',1.15],['lớp',1.32],['Rhodium',1.53],['sau',2.06],['vài',2.27],['năm',2.42],['để',2.77],['giữ',2.90],['độ',3.08],['sáng',3.25],['bóng',3.50],['như',3.69],['mới.',3.81]],
        11: [['Thích',0.08],['truyền',0.26],['thống',0.48],['chọn',0.67],['vàng',0.89],['vàng,',1.06],['chuộng',1.50],['hiện',1.73],['đại',1.94],['trẻ',2.07],['trung',2.24],['thì',2.49],['chốt',2.64],['ngay',2.85],['vàng',3.02],['trắng',3.24],['nhé!',3.43]],
        12: [['Vàng',0.08],['vàng',0.38],['hay',0.58],['Vàng',0.72],['trắng',0.91],['giờ',1.38],['thì',1.66],['bạn',1.85],['đã',2.09],['rõ',2.19],['rồi',2.44],['đấy!',2.59]],
      };

      // Group a line's words into single-line on-screen phrases: <=4 words and
      // <=20 chars (fits the narrow gap band without wrapping), and prefer to
      // break right after a word that ends a clause (, : . ! ?).
      function chunkPhrases(words) {
        const isClause = (s) => /[,.:;!?]$/.test(s);
        const out = [];
        let cur = [];
        let chars = 0;
        for (let i = 0; i < words.length; i++) {
          cur.push(words[i]);
          chars += words[i][0].length + 1;
          const clause = isClause(words[i][0]);
          const nextClause = i + 1 < words.length && isClause(words[i + 1][0]);
          // break after a clause-ender (>=2 words); else at 4 words / ~22 chars —
          // but if the NEXT word ends a clause, take it too (up to 5) so a short
          // tail like "biệt:" / "hơn." isn't orphaned onto its own line.
          if (
            (clause && cur.length >= 2) ||
            chars >= 22 ||
            cur.length >= 5 ||
            (cur.length >= 4 && !nextClause)
          ) {
            out.push(cur);
            cur = [];
            chars = 0;
          }
        }
        if (cur.length) out.push(cur);
        return out;
      }

      // Build the caption DOM once at load (deterministic — no fetch/date/random).
      const capZone = document.getElementById("caption-zone");
      const capRefs = {};
      for (const n of Object.keys(CAPTIONS)) {
        const lineEl = document.createElement("div");
        lineEl.className = "cap-line";
        lineEl.id = "cap-" + n;
        const phrases = chunkPhrases(CAPTIONS[n]).map((pw) => {
          const pEl = document.createElement("div");
          pEl.className = "cap-phrase";
          const wds = pw.map((w) => {
            const s = document.createElement("span");
            s.className = "cap-wd";
            s.textContent = w[0];
            pEl.appendChild(s);
            pEl.appendChild(document.createTextNode(" "));
            return { el: s, at: w[1] };
          });
          lineEl.appendChild(pEl);
          return { el: pEl, wds };
        });
        capZone.appendChild(lineEl);
        capRefs[n] = { lineEl, phrases };
      }

      function showCaption(n) {
        const { lineEl, phrases } = capRefs[n];
        const base = VO[n].start;
        const words = CAPTIONS[n];
        const firstAbs = base + words[0][1];
        const nextLineStart = VO[n + 1] ? VO[n + 1].start : base + VO[n].dur + 0.6;
        const lineEnd = Math.min(base + words[words.length - 1][1] + 0.75, nextLineStart - 0.05);

        tl.set(lineEl, { opacity: 1 }, firstAbs - 0.1);
        tl.to(lineEl, { opacity: 0, duration: 0.18, ease: "power2.in" }, lineEnd);

        phrases.forEach((ph, pi) => {
          const phStart = base + ph.wds[0].at;
          const phEnd = phrases[pi + 1] ? base + phrases[pi + 1].wds[0].at : lineEnd + 0.18;
          // CapCut-style hard swap: one phrase on screen at a time, no crossfade
          // (the word highlight carries the motion). A small pop-in on the group.
          tl.set(ph.el, { visibility: "visible", opacity: 1 }, phStart - 0.04);
          tl.fromTo(ph.el, { y: 12 }, { y: 0, duration: 0.16, ease: "power3.out" }, phStart - 0.04);
          tl.set(ph.el, { visibility: "hidden", opacity: 0 }, phEnd - 0.03);
          ph.wds.forEach((wd, wi) => {
            const on = base + wd.at;
            const off = ph.wds[wi + 1] ? base + ph.wds[wi + 1].at : phEnd - 0.03;
            tl.set(wd.el, { color: "var(--cap-active)", scale: 1.13 }, on);
            tl.set(wd.el, { color: "var(--cap-idle)", scale: 1 }, off);
          });
        });
      }

      // ---------- avatar pose helper ----------
      // 2026-08-31 v5 — SHARED FIXED PLACEMENT (motion-stable). v4 scaled each
      // pose to normalise head size (0.85–1.22); that locked the head but made
      // the whole BODY visibly grow/shrink on every pose change — a "zoom pulse"
      // that reads as jarring when the video plays. v5 gives EVERY pose the same
      // size and position (HOST_BASE), so the body silhouette holds still
      // between beats. All 24 source photos are bottom-aligned (silhouette
      // reaches the frame bottom), so one shared y keeps every waist planted;
      // the trade is that heads land ~50–75px apart in height and ~15% apart in
      // size, following each photo's own framing. POSE_ADJUST holds x/y nudges
      // ONLY (never scale) for the handful of poses whose body sits far
      // off-centre or whose reach would clip — keep it as short as possible.
      // Measured head box + body CoM per pose: assets/actions/actions.json "frame".
      const HOST_BASE = { x: 20, y: 0, scale: 1.0 };
      // 2026-09-01: empty — beats 7/8 switched off point-left-far/point-right-far
      // (removed poses) to point-up-left/point-up-right, which sit fine at HOST_BASE.
      const POSE_ADJUST = {};

      function poseFor(name) {
        const e = POSE_ADJUST[name] || {};
        return {
          // 2026-09-02: poses are now flat 1400x1400 RGBA PNGs, not the old
          // raster-in-SVG (<mask>+feColorMatrix + 2 embedded PNGs). The SVG
          // filter/mask path was re-rasterised nondeterministically by the
          // headless compositor during long static holds → a multi-frame host
          // "pop". A plain PNG <img> has no filter/mask to re-raster.
          attr: { src: "assets/actions/" + name + ".png" },
          x: e.x ?? HOST_BASE.x,
          y: e.y ?? HOST_BASE.y,
          scale: HOST_BASE.scale, // shared across every pose — never set per-pose
          transformOrigin: "50% 0",
        };
      }

      function changePose(name, at) {
        // 2026-09-01: dropped the `scale: 0.985 -> 1` bounce on #host-fx (kept
        // only the opacity dip). Animating a transform on this element forced
        // a composited layer whose raster the headless compositor would drop
        // and rebuild mid-hold, popping one bad frame of the host. Opacity-only
        // keeps the beat-change cross-dissolve without a transform layer.
        tl.to("#host-fx", { opacity: 0.25, duration: 0.15, ease: "power2.in" }, at);
        tl.set("#host-img", poseFor(name), at + 0.15);
        tl.to("#host-fx", { opacity: 1, duration: 0.25, ease: "power2.out" }, at + 0.15);
      }

      // Swap the photo in one panel. The reference clip changes its B-roll on
      // every beat; drop more files into assets/images/ and call this per beat.
      function setCardImage(side, file, at) {
        const sel = "#card-" + side + " .card-image";
        tl.to(sel, { opacity: 0, duration: 0.16, ease: "power2.in" }, at);
        tl.set(sel, { attr: { src: "assets/images/" + file } }, at + 0.16);
        tl.to(sel, { opacity: 1, duration: 0.24, ease: "power2.out" }, at + 0.16);
      }
      void setCardImage;

      // Panel focus — darken the side the host is not talking about.
      function focus(side, at) {
        const veil = (s) => "#card-" + s + " .card-veil";
        const lit = side === "both" ? ["left", "right"] : [side];
        const dim = side === "both" ? [] : [side === "left" ? "right" : "left"];
        lit.forEach((s) => tl.to(veil(s), { opacity: 0, duration: 0.35, ease: "power2.out" }, at));
        dim.forEach((s) => tl.to(veil(s), { opacity: 0.55, duration: 0.35, ease: "power2.out" }, at));
      }

      // 2026-09-02: retimed after trimming ~0.2s lead + ~0.8s trailing silence
      // off every line-*.mp3 (TTS padding), flat 0.34s timeline gap (~0.5s
      // speech-to-speech). Re-synth 2026-09-02 to capture Edge word boundaries
      // for the running captions → durations shifted slightly, total 46.2s → 46.1s (re-synth for word boundaries, gap 0.34→0.14s).
      // Values mirror assets/vo/durations.json (written by scripts/generate-vo.mjs).
      const VO = {
        1: { start: 0.55, dur: 1.243 },
        2: { start: 1.933, dur: 1.3 },
        3: { start: 3.373, dur: 3.254 },
        4: { start: 6.767, dur: 3.538 },
        5: { start: 10.445, dur: 5.356 },
        6: { start: 15.941, dur: 5.652 },
        7: { start: 21.733, dur: 3.834 },
        8: { start: 25.707, dur: 3.8 },
        9: { start: 29.647, dur: 3.754 },
        10: { start: 33.541, dur: 4.3 },
        11: { start: 37.981, dur: 3.811 },
        12: { start: 41.932, dur: 2.981 },
      };
      // Pose set 2026-08: khung vuông cố định, không transform per-pose — xem
      // .host-avatar-img + const POSE_ADJUST trong index.html.
      tl.set("#host-img", poseFor("wave"), 0);

      // ---------- BEAT: HOOK ----------
      changePose("wave", VO[1].start);
      focus("left", VO[1].start);

      changePose("offer-a", VO[2].start);
      focus("right", VO[2].start);

      // ---------- BEAT: QUESTION ----------
      changePose("thinking", VO[3].start);
      focus("both", VO[3].start);

      // ---------- BEAT: BODY (8 điểm so sánh, từ Gemini) ----------
      changePose("shrug-a", VO[4].start);
      focus("both", VO[4].start);

      changePose("point-up-left", VO[5].start);
      focus("left", VO[5].start);

      changePose("point-up-right", VO[6].start);
      focus("right", VO[6].start);

      changePose("point-up-left", VO[7].start); // 2026-09-01: point-left-far removed; reuse point-up-left (also beat 5)
      focus("left", VO[7].start);

      changePose("point-up-right", VO[8].start); // 2026-09-01: point-right-far removed; reuse point-up-right (also beat 6)
      focus("right", VO[8].start);

      changePose("explain-a", VO[9].start);
      focus("left", VO[9].start);

      changePose("explain-b", VO[10].start);
      focus("right", VO[10].start);

      changePose("thumbs-up-a", VO[11].start);
      focus("both", VO[11].start);

      // ---------- BEAT: PAYOFF ----------
      changePose("thumbs-up-a", VO[12].start);
      focus("both", VO[12].start);
      tl.fromTo("#avatar-host", { scale: 1 }, { scale: 1.03, duration: 0.3, ease: "power2.out", yoyo: true, repeat: 1 }, VO[12].start);

      // ---------- running captions ----------
      // 2026-09-03: fixed titles above the photos never change, so every spoken
      // line now gets its own running caption below.
      for (let n = 1; n <= 12; n++) showCaption(n);

      const ROOT_DURATION = 46.1;
      window.__timelines["main"] = tl;
    </script>

    <!-- Standalone player, for opening this file straight in a browser.
         Hidden unless the URL carries ?preview — the renderer loads the bare
         file, so this never gets baked into the MP4. -->
    <style>
      #hf-standalone-player {
        display: none;
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 99999;
        align-items: center;
        gap: 16px;
        background: rgba(23, 18, 44, 0.95);
        border: 1px solid #2b2350;
        padding: 12px 24px;
        border-radius: 40px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        color: #f3f1ff;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #hf-standalone-player.hf-preview-on {
        display: flex;
      }
      #hf-play-btn {
        background: #37e6c4;
        color: #0d0a1a;
        border: none;
        padding: 10px 22px;
        border-radius: 20px;
        font-weight: 900;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 4px 15px rgba(55, 230, 196, 0.4);
      }
      #hf-standalone-player input[type="range"] {
        width: 280px;
        accent-color: #37e6c4;
        cursor: pointer;
      }
      #hf-standalone-player span {
        font-size: 13px;
        font-family: monospace;
        font-weight: bold;
        color: #37e6c4;
      }
    </style>
    <div id="hf-standalone-player">
      <button id="hf-play-btn">▶ PLAY VIDEO</button>
      <input type="range" id="hf-scrubber" min="0" max="46.1" step="0.05" value="0">
      <span id="hf-time-display">0.0s / 46.1s</span>
    </div>

    <script>
      (function () {
        const player = document.getElementById("hf-standalone-player");
                // Hide the bar under browser automation only: the renderer and
        // `hyperframes snapshot` both report navigator.webdriver === true (verified),
        // so it never lands in an MP4, while a real browser tab still gets controls.
        // ?preview forces it on if you ever need it in a headless context.
        if (navigator.webdriver && !/(^|[?&])preview(=|&|$)/.test(location.search)) return;
        player.classList.add("hf-preview-on");

        const btn = document.getElementById("hf-play-btn");
        const scrubber = document.getElementById("hf-scrubber");
        const timeDisplay = document.getElementById("hf-time-display");
        const audios = Array.from(document.querySelectorAll("audio"));
        const ROOT_DURATION = 46.1;

        let isPlaying = false;

        function updateUI() {
          const t = tl.time();
          scrubber.value = t;
          timeDisplay.textContent = t.toFixed(1) + "s / " + ROOT_DURATION.toFixed(1) + "s";
        }

        function syncAudio() {
          const currentTime = tl.time();
          audios.forEach((audio) => {
            const start = parseFloat(audio.getAttribute("data-start"));
            const dur = parseFloat(audio.getAttribute("data-duration"));
            const end = start + dur;

            if (isPlaying && currentTime >= start && currentTime <= end) {
              if (audio.paused) {
                audio.currentTime = currentTime - start;
                audio.play().catch(() => {});
              }
            } else if (!audio.paused) {
              audio.pause();
            }
          });
        }

        tl.eventCallback("onUpdate", () => {
          updateUI();
          syncAudio();
        });

        tl.eventCallback("onComplete", () => {
          isPlaying = false;
          btn.textContent = "▶ REPLAY";
          audios.forEach((a) => a.pause());
        });

        btn.addEventListener("click", () => {
          if (isPlaying) {
            tl.pause();
            isPlaying = false;
            btn.textContent = "▶ PLAY VIDEO";
            audios.forEach((a) => a.pause());
          } else {
            if (tl.time() >= ROOT_DURATION - 0.2) tl.restart();
            else tl.play();
            isPlaying = true;
            btn.textContent = "⏸ PAUSE";
          }
        });

        scrubber.addEventListener("input", (e) => {
          tl.time(parseFloat(e.target.value));
          updateUI();
          syncAudio();
        });
      })();
    </script>
  </body>
</html>
