<!DOCTYPE html>
<html lang="__HTML_LANG__">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <title>__DOC_TITLE__</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Font: file woff2 LOCAL trong assets/fonts/ (giấy phép OFL, xem assets/fonts/README.md) — KHÔNG tải CDN lúc render.
         Danh sách @font-face + chuỗi font theo thị trường do scaffold-compare-video.mjs điền từ config/locales/<code>.json. */
/*FONT_FACES*/
      :root {
        --font-display: __FONT_DISPLAY__;
        --font-mono: __FONT_MONO__;
        --label-px: __LABEL_PX__px;
        --label-style: __LABEL_STYLE__;
        --label-transform: __LABEL_TRANSFORM__;
        --cap-px: __CAP_PX__px;
        --cap-gap: __CAP_GAP__px;
      }
    </style>
    <style>
      :root {
        --bg-fallback: #f5f4f6; /* sampled from assets/backgrounds/paper-crumpled.webp's top corner — edge/load fallback only, the image covers the frame */
        --accent-yellow: #ffe600;
        --dark-stroke: #000000;
        --cap-idle: #ffffff;   /* running-caption word, not yet spoken / already spoken */
        --cap-active: #ffe600;  /* running-caption word being spoken right now */
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        font-family: var(--font-display);
      }

      /* Crumpled-paper backdrop (2026-09-07, replaces the marble jewelry-stand
         theme). assets/backgrounds/paper-crumpled.webp is already 1080x1920 —
         exactly this canvas, so `cover` renders it 1:1 with no crop/letterbox.
         (Source: assets/backgrounds/pexels-photo-20818860.avif, 2480x3508,
         centre-cropped to 9:16 and downscaled — see README.) This backdrop is
         LIGHT, unlike the marble one: every headline/label/caption already
         carries a heavy black -webkit-text-stroke so they still read, but
         #eyebrow had to be recoloured off cream. Painted directly on #root: this
         composition is standalone (not assembled from multiple frame.md
         scenes) and uses no shader transitions/HDR, so a root-level fill is
         safe here (see hyperframes-core § determinism-rules). Card/label/host
         positions below are unchanged from the paper version. */
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background-color: var(--bg-fallback);
        background-image: url("assets/backgrounds/paper-crumpled.webp");
        background-size: cover;
        background-position: center top;
        background-repeat: no-repeat;
      }

      .clip {
        position: absolute;
        inset: 0;
      }

      /* ---------- top comparison zone ----------
         Two parallel panels, 48px paper seam, ~96px paper margin each outer
         edge. No VS badge, no card chrome — the photos are the graphic.
         (2026-08-31 v3: shrunk to 420x456 and pushed down to top:165 so the
         platform UI — follow button / channel name in the top ~150-200px —
         and the phone's rounded corners don't clip the panels on social feeds.) */
      .card {
        position: absolute;
        top: 360px; /* 2026-09-02 v3: pushed down so the comparison labels sit
                       ABOVE the photos (Mousse/Panna-Cotta style) and still
                       clear the TikTok top-UI / safe-area crop (~y0-230). */
        width: 420px;
        height: 372px;
        overflow: hidden;
        background: #000;
        /* soft drop shadow + a thin accent outline that floats off the photo (outline is drawn OUTSIDE the
           box, so overflow:hidden doesn't clip it). Both are tweened by focus(); outline starts transparent. */
        box-shadow: rgba(0, 0, 0, 0.3) 0px 14px 32px 0px;
        outline: 3px solid rgba(255, 230, 0, 0);
        outline-offset: 16px;
      }
      #card-left {
        left: 96px;
      }
      #card-right {
        left: 564px;
      }
      .card-image {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: saturate(1); /* explicit start so focus() can tween it (a "none" start would snap) */
      }
      /* darkens the off-topic panel — fading .card itself would blend it into
         the backdrop and wash it out instead */
      .card-veil {
        position: absolute;
        inset: 0;
        background: #0a0a12;
        opacity: 0;
        will-change: opacity;
      }

      /* ---------- beat labels (under each panel, on the backdrop) ----------
         The reference clip carries NO sentence subtitles — the voiceover says
         the sentence, the screen shows a short tag per side.
         (2026-08-31 v3: columns pulled inside a 72px left/right safe margin and
         the font stepped down so long Vietnamese tags wrap instead of bleeding
         off the 1080px frame / being clipped by the social-feed crop.) */
      #label-zone {
        position: absolute;
        top: 244px; /* 2026-09-02 v3: side tags now sit ABOVE the photos. Below
                       the TikTok top-crop line (~y230), above .card (y360). */
        left: 0;
        width: 1080px;
        height: 106px;
      }
      .beat-labels {
        position: absolute;
        inset: 0;
        opacity: 0;
      }
      .lb-col {
        position: absolute;
        top: 0;
        width: 444px;
        text-align: center;
      }
      .lb-left {
        left: 72px;
      }
      .lb-right {
        left: 564px;
      }
      .lb-wide {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        /* 2026-09-02 v3: the wide title (hook / question / CTA on beats 3,4,11,12)
           is too tall for the 106px side-tag band above the photos — drop it into
           the gap BELOW the photos (y ~742), where those beats show no running
           caption anyway. inset:auto cancels .beat-labels' inset:0. */
        inset: auto;
        top: 498px;
        left: 72px;
        right: 72px;
      }
      .lb-wide .lb-col {
        position: static;
        width: 936px;
      }
      .lb-1,
      .lb-2 {
        font-family: var(--font-display);
        font-weight: 900;
        font-style: var(--label-style);
        text-transform: var(--label-transform);
        line-height: 1.08;
        white-space: nowrap; /* line breaks are explicit (<br>) — computed by scripts/lib/fit-check.mjs and measured with the real font */
        -webkit-text-stroke: 4px var(--dark-stroke);
        paint-order: stroke fill;
        text-shadow:
          3px 3px 0 #000,
          -3px -3px 0 #000,
          3px -3px 0 #000,
          -3px 3px 0 #000;
      }
      .lb-1 {
        font-size: var(--label-px);
        letter-spacing: -0.01em;
        color: var(--accent-yellow);
      }
      .lb-wide .lb-1 {
        font-size: 60px;
      }
      /* The wide block carries the Gemini title, which the schema only caps at
         120 chars — without these tiers a long one wraps past the label zone
         and lands on the host's head. Applied by scaffold-compare-video.mjs. */
      .lb-wide.lb-tight .lb-1 {
        font-size: 46px;
      }
      .lb-wide.lb-tighter .lb-1 {
        font-size: 38px;
        -webkit-text-stroke: 3px var(--dark-stroke);
      }
      .lb-wide.lb-tightest .lb-1 {
        font-size: 32px;
        -webkit-text-stroke: 3px var(--dark-stroke);
      }
      .lb-2 {
        margin-top: 3px;
        font-size: 22px;
        color: #ffffff;
        -webkit-text-stroke: 3px var(--dark-stroke);
      }
      .lb-wide .lb-2 {
        font-size: 36px;
      }

      /* channel tag — kept for scripts/sync-channel.mjs, parked in the corner
         (2026-08-31 v3: nudged inside the 64px safe margin. 2026-09-07: back to
         dark ink + a white halo — the cream #f2ead8 was for the marble
         backdrop's dark navy top corner and vanishes on the crumpled-paper
         backdrop, which reads ~#f5f4f6 up there.) */
      #eyebrow {
        position: absolute;
        top: 44px;
        left: 64px;
        font-family: var(--font-mono);
        font-weight: 700;
        font-size: 22px;
        letter-spacing: 0.14em;
        color: #2f2b26;
        text-shadow: 0 1px 2px rgba(255, 255, 255, 0.85);
        opacity: 0;
        z-index: 6;
      }

      /* ---------- bottom host zone (Host HuyK) ----------
         The 2026-08 pose set is a 1:1 (square) 300x300 SVG canvas, each a
         waist-up photo cropped so the body reaches the frame bottom. All poses
         render at ONE shared size/position (see HOST_BASE in the script) so the
         body doesn't pulse between beats in motion — full rationale there. */
      #avatar-host {
        position: absolute;
        top: 866px;
        left: 0;
        width: 1080px;
        height: 1054px;
        opacity: 0;
        overflow: hidden;
        transform-origin: 50% 100%;
      }
      #host-fx {
        position: absolute;
        inset: 0;
        transform-origin: 50% 12%;
        /* 2026-09-01: was `will-change: transform, opacity`. The composited
           layer that promoted was getting dropped + re-rasterised by the
           headless compositor during long static pose holds, popping one
           frame of the host at a slightly-wrong raster (~18.70s / ~28.07s in
           the 2026-08-31 render, both "point" poses — widest silhouettes so
           the blip cleared the frame-diff threshold). Keep only opacity
           promoted; nothing animates this element's transform any more. */
        will-change: opacity;
      }
      .host-avatar-img {
        position: absolute;
        /* 2026-09-04 "chạm viền dưới": ảnh host = đúng bề ngang khung (1080), đáy
           ảnh trùng mép dưới khung (top -26 = 1054 container - 1080). Pose PNG đã
           căn người sát đáy → chân đế bóng người nằm đúng y1920, host chiếm trọn
           dải dưới, không còn hở sàn. #avatar-host{overflow:hidden} cắt 26px tràn
           lên trên. GSAP vẫn drive x/y/scale (transform-origin 50% 0). */
        top: -26px;
        left: 50%;
        width: 1080px;
        height: 1080px;       /* MUST stay square — the pose assets are 1:1 */
        margin-left: -540px;  /* centre */
        transform-origin: 50% 0;
      }

      /* ---------- running captions (TikTok/CapCut style) ----------
         2026-09-02 v3: side tags moved ABOVE the photos, so the gap BELOW the
         photos (photos end ~y732, host head ~y880) is now free for the caption.
         Single-line phrases (<=4 words). The word being spoken turns
         --cap-active and scales up. Per-word timing = assets/vo/words.json
         (Edge TTS boundaries). Plain GSAP-driven divs like #lb-*, no
         class="clip". Shares the y-band with .lb-wide, but those beats (3/4/11/12)
         show no running caption. */
      #caption-zone {
        position: absolute;
        top: 744px;
        left: 40px;
        width: 1000px;
        height: 96px;
        z-index: 8;
      }
      .cap-line {
        position: absolute;
        inset: 0;
        opacity: 0; /* plain opacity (not autoAlpha) — parent opacity:0 hides the
                       whole subtree regardless of a child phrase's visibility */
      }
      .cap-phrase {
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        text-align: center;
        white-space: nowrap; /* phrases are chunked <=4 words so they always fit one line */
        opacity: 0;
        visibility: hidden;
      }
      .cap-wd {
        display: inline-block;
        font-family: var(--font-display);
        font-weight: 900;
        font-size: var(--cap-px);
        line-height: 1.1;
        color: var(--cap-idle);
        -webkit-text-stroke: 5px var(--dark-stroke);
        paint-order: stroke fill;
        text-shadow:
          3px 3px 0 #000,
          -2px -2px 0 #000,
          2px -2px 0 #000,
          -2px 2px 0 #000;
        transform-origin: 50% 65%;
        /* Breathing room so the scaled-up active word (scale:1.13, see the karaoke
           tl.set below) doesn't crowd its neighbours. 6px used to be the value here,
           but -webkit-text-stroke (5px, painted outside the glyph outline) already eats
           most of that at rest, so ANY word touched its neighbour once scaled — not
           just long ones (confirmed: "Kim" against "cương", "Moissanite" against "đá"/
           "cực"). 16px leaves enough margin for the stroke + the ~13% scale bleed. */
        margin: 0 var(--cap-gap);
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-acv0" id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="__ROOT_DURATION__">
      <section data-hf-id="hf-acv1" id="scene" class="clip" data-start="0" data-duration="__ROOT_DURATION__" data-track-index="1">

        <!-- top: full-bleed comparison panels -->
        <div data-hf-id="hf-acv4" id="card-left" class="card" data-layout-allow-overflow="true">
          <img data-hf-id="hf-acv6" class="card-image" src="__CARD_LEFT_SRC__" alt="__LABEL_LEFT__" />
          <div data-hf-id="hf-acv5" class="card-veil"></div>
        </div>
        <div data-hf-id="hf-acv8" id="card-right" class="card" data-layout-allow-overflow="true">
          <img data-hf-id="hf-acva" class="card-image" src="__CARD_RIGHT_SRC__" alt="__LABEL_RIGHT__" />
          <div data-hf-id="hf-acv9" class="card-veil"></div>
        </div>

        <div data-hf-id="hf-acve" id="eyebrow">__DEFAULT_EYEBROW__</div>

        <!-- FIXED comparison titles above each photo (Mousse/Panna-Cotta style).
             2026-09-03: one static pair for the whole video — the video's subject
             is "Vàng vàng vs Vàng trắng" from the start; the per-beat detail is
             carried by the running caption below, so these never change. -->
        <div data-hf-id="hf-acvf" id="label-zone">
          <div class="beat-labels" id="lb-fixed">
            <div class="lb-col lb-left"><div class="lb-1">__LABEL_LEFT_HTML__</div></div>
            <div class="lb-col lb-right"><div class="lb-1">__LABEL_RIGHT_HTML__</div></div>
          </div>
        </div>

        <!-- bottom: photo host HuyK -->
        <div data-hf-id="hf-acvg" id="avatar-host">
          <div data-hf-id="hf-acvz" id="host-fx" data-layout-allow-overflow="true">
            <img data-hf-id="hf-acvh" id="host-img" class="host-avatar-img" src="__AVATAR_INITIAL_SRC__" alt="Host" />
          </div>
        </div>

        <!-- running captions: word-by-word karaoke, built at load from CAPTIONS -->
        <div data-hf-id="hf-acvc" id="caption-zone" data-layout-allow-overflow="true"></div>
      </section>

      <!-- narration: audio clips -->
<!--AUDIO_TAGS-->
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ---------- entrance ----------
      tl.fromTo("#card-left", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 0.0);
      tl.fromTo("#card-right", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 0.15);
      tl.fromTo("#avatar-host", { scale: 0.94, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.1);
      tl.fromTo("#eyebrow", { y: 8, opacity: 0 }, { y: 0, opacity: 0.55, duration: 0.4, ease: "power3.out" }, 0.15);

      // Fixed comparison titles above the photos — fade in once with the cards,
      // hold for the whole video (they never change; per-beat detail is the caption).
      tl.fromTo("#lb-fixed", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.28);

      // ---------- running captions (word-by-word karaoke) ----------
      // [word, start-sec] per line, from assets/vo/words.json (Edge TTS word
      // boundaries), starts relative to each clip's trimmed audio.
      // Injected by scaffold-compare-video.mjs from assets/vo/words.json.
      const CAPTIONS = {
/*CAPTIONS_OBJECT*/
      };

      // Phrase layout per spoken line: [wordCount, fontPx|0] per on-screen phrase (0 = default size).
      // Computed at scaffold time by scripts/lib/fit-check.mjs (locale-aware line breaking + overflow check
      // measured with the real fonts), so the composition itself stays deterministic and locale-agnostic.
      const PHRASES = {
/*PHRASES_OBJECT*/
      };
      const CAP_JOINER = "__CAP_JOINER__"; // "" for ja/th (no spaces between words), " " otherwise
      const CAP_ACTIVE_SCALE = __CAP_ACTIVE_SCALE__;

      function chunkPhrases(words, n) {
        const out = [];
        let i = 0;
        for (const [count, px] of PHRASES[n]) {
          out.push({ words: words.slice(i, i + count), px });
          i += count;
        }
        return out;
      }

      // Build the caption DOM once at load (deterministic — no fetch/date/random).
      const capZone = document.getElementById("caption-zone");
      const capRefs = {};
      for (const n of Object.keys(CAPTIONS)) {
        const lineEl = document.createElement("div");
        lineEl.className = "cap-line";
        lineEl.id = "cap-" + n;
        const phrases = chunkPhrases(CAPTIONS[n], n).map((ph) => {
          const pEl = document.createElement("div");
          pEl.className = "cap-phrase";
          if (ph.px) pEl.style.setProperty("--cap-px", ph.px + "px");
          const wds = ph.words.map((w) => {
            const s = document.createElement("span");
            s.className = "cap-wd";
            s.textContent = w[0];
            pEl.appendChild(s);
            if (CAP_JOINER) pEl.appendChild(document.createTextNode(CAP_JOINER));
            return { el: s, at: w[1] };
          });
          lineEl.appendChild(pEl);
          return { el: pEl, wds };
        });
        capZone.appendChild(lineEl);
        capRefs[n] = { lineEl, phrases };
      }

      // When caption line n fades out. A line pops in 0.1s BEFORE its first word, so line n must be fully
      // invisible before the next caption line appears — otherwise the two lines overlap for a few frames
      // (tight speech, esp. Japanese). Pure function (no tl/DOM) so test/caption-window.test.mjs can run it.
      /* captionWindow:start */
      function captionWindow(n, vo, captions) {
        const FADE = 0.18, LINGER = 0.75, SAFE = 0.02, LEAD = 0.1;
        const base = vo[n].start;
        const words = captions[n];
        const lastAbs = base + words[words.length - 1][1];
        const nextBeatStart = vo[n + 1] ? vo[n + 1].start : base + vo[n].dur + 0.6;
        const nextCap = Object.keys(captions).map(Number).sort((a, b) => a - b).find((k) => k > n);
        const nextAppear = nextCap === undefined ? Infinity : vo[nextCap].start + captions[nextCap][0][1] - LEAD;
        const hideBy = Math.min(nextBeatStart + FADE - 0.05, nextAppear - SAFE);
        const fadeStart = Math.max(lastAbs, Math.min(lastAbs + LINGER, hideBy - FADE));
        const fadeDur = Math.min(FADE, hideBy - fadeStart);
        // not enough room to fade: hard cut at hideBy (a truncated last word beats two lines on screen)
        return fadeDur >= 0.02 ? { fadeStart, fadeDur, hideAt: fadeStart + fadeDur } : { fadeStart: hideBy, fadeDur: 0, hideAt: hideBy };
      }

      // Mốc hiện/ẩn của cụm chữ pi trong 1 câu. Cụm cũ phải ẩn CÙNG LÚC (không muộn hơn) cụm mới hiện, nếu không có
      // khoảng ~10ms cả hai cùng hiện và 1 khung hình rơi trúng đó thì thấy chữ chồng nhau.
      function phraseTimes(base, starts, pi, lineHideAt) {
        const hasNext = starts[pi + 1] !== undefined;
        const phEnd = hasNext ? base + starts[pi + 1] : lineHideAt + 0.03;
        return { phStart: base + starts[pi], phEnd, showAt: base + starts[pi] - 0.04, hideAt: phEnd - (hasNext ? 0.04 : 0.03) };
      }
      /* captionWindow:end */

      function showCaption(n) {
        const { lineEl, phrases } = capRefs[n];
        const base = VO[n].start;
        const words = CAPTIONS[n];
        const firstAbs = base + words[0][1];
        const { fadeStart, fadeDur, hideAt } = captionWindow(n, VO, CAPTIONS);

        tl.set(lineEl, { opacity: 1 }, firstAbs - 0.1);
        if (fadeDur > 0) tl.to(lineEl, { opacity: 0, duration: fadeDur, ease: "power2.in" }, fadeStart);
        else tl.set(lineEl, { opacity: 0 }, fadeStart);

        const starts = phrases.map((ph) => ph.wds[0].at);
        phrases.forEach((ph, pi) => {
          const { phEnd, showAt, hideAt: phHideAt } = phraseTimes(base, starts, pi, hideAt);
          // CapCut-style hard swap: one phrase on screen at a time, no crossfade
          // (the word highlight carries the motion). A small pop-in on the group.
          tl.set(ph.el, { visibility: "visible", opacity: 1 }, showAt);
          tl.fromTo(ph.el, { y: 12 }, { y: 0, duration: 0.16, ease: "power3.out" }, showAt);
          tl.set(ph.el, { visibility: "hidden", opacity: 0 }, phHideAt);
          ph.wds.forEach((wd, wi) => {
            const on = base + wd.at;
            const off = ph.wds[wi + 1] ? base + ph.wds[wi + 1].at : phEnd - 0.03;
            tl.set(wd.el, { color: "var(--cap-active)", scale: CAP_ACTIVE_SCALE }, on);
            tl.set(wd.el, { color: "var(--cap-idle)", scale: 1 }, off);
          });
        });
      }

      // ---------- avatar pose helper ----------
      // 2026-08-31 v5 — SHARED FIXED PLACEMENT (motion-stable). v4 scaled each
      // pose to normalise head size (0.85–1.22); that locked the head but made
      // the whole BODY visibly grow/shrink on every pose change — a "zoom pulse"
      // that reads as jarring when the video plays. v5 gives EVERY pose the same
      // size and position (HOST_BASE), so the body silhouette holds still
      // between beats. All 24 source photos are bottom-aligned (silhouette
      // reaches the frame bottom), so one shared y keeps every waist planted;
      // the trade is that heads land ~50–75px apart in height and ~15% apart in
      // size, following each photo's own framing. POSE_ADJUST holds x/y nudges
      // ONLY (never scale) for the handful of poses whose body sits far
      // off-centre or whose reach would clip — keep it as short as possible.
      // Measured head box + body CoM per pose: assets/actions/actions.json "frame".
      const HOST_BASE = { x: 20, y: 0, scale: 1.0 };
      // 2026-09-01: empty — beats 7/8 switched off point-left-far/point-right-far
      // (removed poses) to point-up-left/point-up-right, which sit fine at HOST_BASE.
      const POSE_ADJUST = {};

      function poseFor(name) {
        const e = POSE_ADJUST[name] || {};
        return {
          // Poses are raster-in-SVG (assets/actions/*.svg — see actions.json).
          // The SVG <mask>+feColorMatrix path can be re-rasterised
          // nondeterministically by a multi-worker headless compositor during
          // long static holds → a multi-frame host "pop"; render with
          // `--workers=1` (baked into this video's `npm run render`).
          attr: { src: "assets/actions/" + name + ".svg" },
          x: e.x ?? HOST_BASE.x,
          y: e.y ?? HOST_BASE.y,
          scale: HOST_BASE.scale, // shared across every pose — never set per-pose
          transformOrigin: "50% 0",
        };
      }

      function changePose(name, at) {
        // 2026-09-01: dropped the `scale: 0.985 -> 1` bounce on #host-fx (kept
        // only the opacity dip). Animating a transform on this element forced
        // a composited layer whose raster the headless compositor would drop
        // and rebuild mid-hold, popping one bad frame of the host. Opacity-only
        // keeps the beat-change cross-dissolve without a transform layer.
        tl.to("#host-fx", { opacity: 0.25, duration: 0.15, ease: "power2.in" }, at);
        tl.set("#host-img", poseFor(name), at + 0.15);
        tl.to("#host-fx", { opacity: 1, duration: 0.25, ease: "power2.out" }, at + 0.15);
      }

      // Swap the photo in one panel. The reference clip changes its B-roll on
      // every beat; drop more files into assets/images/ and call this per beat.
      function setCardImage(side, file, at) {
        const sel = "#card-" + side + " .card-image";
        tl.to(sel, { opacity: 0, duration: 0.16, ease: "power2.in" }, at);
        tl.set(sel, { attr: { src: "assets/images/" + file } }, at + 0.16);
        tl.to(sel, { opacity: 1, duration: 0.24, ease: "power2.out" }, at + 0.16);
      }
      void setCardImage;

      // Panel focus — make it unmistakable WHICH side the host is talking about.
      //   active   : card lifts (scale 1.04) with a thin accent frame floating 7px off the photo, its photo slowly pushes in
      //              (Ken Burns) for as long as the side is active, its title scales up
      //   inactive : card recedes (0.95), photo slightly desaturated + dimmed by .card-veil, title dims
      //   both     : everything neutral, photos drift in gently together
      // focus() only RECORDS the change; flushFocus() (end of script) builds the tweens once the end of
      // each span is known, so the push-in lasts exactly as long as the side stays active.
      const FOCUS_EVENTS = [];
      function focus(side, at) {
        FOCUS_EVENTS.push({ side, at });
      }

      /* focusSpans:start */
      // [{ side, at, end }] — each focus lasts until the next one (the last until the end of the video).
      function focusSpans(events, endAt) {
        const sorted = events.slice().sort((a, b) => a.at - b.at);
        return sorted.map((ev, i) => ({ side: ev.side, at: ev.at, end: i + 1 < sorted.length ? sorted[i + 1].at : Math.max(endAt, ev.at) }));
      }
      /* focusSpans:end */

      function flushFocus(endAt) {
        const POP = 0.55; // seconds for the pop / settle transition
        const ACCENT = "rgba(255, 230, 0, 1)";
        // active: gentle lift + floating accent frame; idle: recede (smaller, slightly faded) — restrained on purpose
        const ACTIVE = { card: 1.04, veil: 0, outline: ACCENT, offset: 7, label: 1.05, labelOpacity: 1, shadow: "rgba(0, 0, 0, 0.42) 0px 24px 48px 0px", sat: 1, push: 1.08 };
        const IDLE = { card: 0.95, veil: 0.32, outline: "rgba(255, 230, 0, 0)", offset: 16, label: 0.95, labelOpacity: 0.55, shadow: "rgba(0, 0, 0, 0.2) 0px 8px 20px 0px", sat: 0.55, push: 1 };
        const NEUTRAL = { card: 1, veil: 0, outline: "rgba(255, 230, 0, 0)", offset: 16, label: 1, labelOpacity: 1, shadow: "rgba(0, 0, 0, 0.3) 0px 14px 32px 0px", sat: 1, push: 1.04 };
        focusSpans(FOCUS_EVENTS, endAt).forEach(({ side, at, end }) => {
          ["left", "right"].forEach((s) => {
            const st = side === "both" ? NEUTRAL : side === s ? ACTIVE : IDLE;
            const card = "#card-" + s;
            const img = card + " .card-image";
            tl.to(card, { scale: st.card, boxShadow: st.shadow, duration: POP, ease: st === ACTIVE ? "back.out(1.3)" : "power3.out" }, at);
            tl.to(card, { outlineColor: st.outline, outlineOffset: st.offset + "px", duration: POP, ease: "power2.out" }, at);
            tl.to(card + " .card-veil", { opacity: st.veil, duration: POP, ease: "power2.out" }, at);
            tl.to("#lb-fixed .lb-" + s + " .lb-1", { scale: st.label, opacity: st.labelOpacity, duration: POP, ease: "power3.out" }, at);
            tl.to(img, { filter: "saturate(" + st.sat + ")", duration: POP, ease: "power2.out" }, at);
            // slow push-in while the side is on screen; settles back when it loses focus
            if (st.push > 1) tl.fromTo(img, { scale: 1 }, { scale: st.push, duration: Math.max(0.01, end - at), ease: "none" }, at);
            else tl.to(img, { scale: 1, duration: POP, ease: "power2.out" }, at);
          });
        });
      }

      // Retimed after trimming ~0.2s lead + ~0.8s trailing silence off every
      // line-*.mp3 (TTS padding) and a flat timeline gap — see generate-vo.mjs.
      // Values mirror assets/vo/durations.json; injected by scaffold-compare-video.mjs.
      const VO = {
/*VO_OBJECT*/
      };

/*TIMELINE_BEATS*/

      // ---------- running captions ----------
      // Fixed titles above the photos never change, so every spoken line gets
      // its own running caption in the gap between the photos and the host.
      for (const n of Object.keys(CAPTIONS).map(Number)) showCaption(n);

      const ROOT_DURATION = __ROOT_DURATION__;
      flushFocus(ROOT_DURATION);
      window.__timelines["main"] = tl;
    </script>

    <!-- Standalone player, for opening this file straight in a browser.
         Hidden unless the URL carries ?preview — the renderer loads the bare
         file, so this never gets baked into the MP4. -->
    <style>
      #hf-standalone-player {
        display: none;
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 99999;
        align-items: center;
        gap: 16px;
        background: rgba(23, 18, 44, 0.95);
        border: 1px solid #2b2350;
        padding: 12px 24px;
        border-radius: 40px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        color: #f3f1ff;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #hf-standalone-player.hf-preview-on {
        display: flex;
      }
      #hf-play-btn {
        background: #37e6c4;
        color: #0d0a1a;
        border: none;
        padding: 10px 22px;
        border-radius: 20px;
        font-weight: 900;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 4px 15px rgba(55, 230, 196, 0.4);
      }
      #hf-standalone-player input[type="range"] {
        width: 280px;
        accent-color: #37e6c4;
        cursor: pointer;
      }
      #hf-standalone-player span {
        font-size: 13px;
        font-family: monospace;
        font-weight: bold;
        color: #37e6c4;
      }
    </style>
    <div id="hf-standalone-player">
      <button id="hf-play-btn">▶ PLAY VIDEO</button>
      <input type="range" id="hf-scrubber" min="0" max="__ROOT_DURATION__" step="0.05" value="0">
      <span id="hf-time-display">0.0s / __ROOT_DURATION__s</span>
    </div>

    <script>
      (function () {
        const player = document.getElementById("hf-standalone-player");
                // Hide the bar under browser automation only: the renderer and
        // `hyperframes snapshot` both report navigator.webdriver === true (verified),
        // so it never lands in an MP4, while a real browser tab still gets controls.
        // ?preview forces it on if you ever need it in a headless context.
        if (navigator.webdriver && !/(^|[?&])preview(=|&|$)/.test(location.search)) return;
        player.classList.add("hf-preview-on");

        const btn = document.getElementById("hf-play-btn");
        const scrubber = document.getElementById("hf-scrubber");
        const timeDisplay = document.getElementById("hf-time-display");
        const audios = Array.from(document.querySelectorAll("audio"));
        const ROOT_DURATION = __ROOT_DURATION__;

        let isPlaying = false;

        function updateUI() {
          const t = tl.time();
          scrubber.value = t;
          timeDisplay.textContent = t.toFixed(1) + "s / " + ROOT_DURATION.toFixed(1) + "s";
        }

        function syncAudio() {
          const currentTime = tl.time();
          audios.forEach((audio) => {
            const start = parseFloat(audio.getAttribute("data-start"));
            const dur = parseFloat(audio.getAttribute("data-duration"));
            const end = start + dur;

            if (isPlaying && currentTime >= start && currentTime <= end) {
              if (audio.paused) {
                audio.currentTime = currentTime - start;
                audio.play().catch(() => {});
              }
            } else if (!audio.paused) {
              audio.pause();
            }
          });
        }

        tl.eventCallback("onUpdate", () => {
          updateUI();
          syncAudio();
        });

        tl.eventCallback("onComplete", () => {
          isPlaying = false;
          btn.textContent = "▶ REPLAY";
          audios.forEach((a) => a.pause());
        });

        btn.addEventListener("click", () => {
          if (isPlaying) {
            tl.pause();
            isPlaying = false;
            btn.textContent = "▶ PLAY VIDEO";
            audios.forEach((a) => a.pause());
          } else {
            if (tl.time() >= ROOT_DURATION - 0.2) tl.restart();
            else tl.play();
            isPlaying = true;
            btn.textContent = "⏸ PAUSE";
          }
        });

        scrubber.addEventListener("input", (e) => {
          tl.time(parseFloat(e.target.value));
          updateUI();
          syncAudio();
        });
      })();
    </script>
  </body>
</html>
